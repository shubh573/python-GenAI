[project]
name = "stock_picker"
version = "0.1.0"
description = "stock_picker using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.5,<2.0.0"
]

[project.scripts]
kickoff = "stock_picker.main:kickoff"
run_crew = "stock_picker.main:kickoff"
plot = "stock_picker.main:plot"
run_with_trigger = "stock_picker.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
